[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "secureflow"
version = "2.0.0"
description = "Autonomous software supply chain security agent"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["secureflow*"]
